  learning_rate: 1.0e-6
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  scheduler: constant_after_linear_warmup
  warmup_windows: 10
  scheduler_step_unit: rollout_window
  gradient_checkpointing: true
  bf16: true
  tf32: true
  seed: 42
  logging_windows: 10
  resume_save_updates: 4
  num_iterations: 1

memory:
