  unique_sids: 905469
  domain_a_nodes: 10744
  domain_ab_nodes: 429540

rollout:
  num_generations: 16
  prompt_batch_size: 8
  max_active_sequences: 16
  candidates_per_prompt_wave: 2
  max_completion_length: 32
  do_sample: true
  num_beams: 1
  temperature: 1.2
  top_k: 0
