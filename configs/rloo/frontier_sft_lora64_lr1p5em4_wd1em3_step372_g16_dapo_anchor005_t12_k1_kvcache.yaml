# DAPO-Anchor: mean-centred advantage + anchor loss.
# Inherits SFT checkpoint-372, frontier_v1 training data, 2 effective epochs.
#
# Architecture:
#   Phase 1 — RL:  clipped group-relative (r - mean), no std division
#   Phase 2 — Anchor: teacher-forced GT -mean(logp) on filter groups
#                     λ=0.05 fixed, B=16, warmup 10 windows
#   Advantage: A_i = r_i - mean  (not (r - mean) / std, not leave-one-out)
#   Prefix tree: frontier_v1 905k unique SIDs (unchanged from DAPO)

schema_version: 1
spec_version: "DAPO-ANCHOR-V1-SFT372"
profile: "frontier_sft_lora64_lr1p5em4_wd1em3_step372_dapo_anchor005_t12_k1_kvcache"

model:
  base_model: /home/lyc/models/OneReason-0.8B-pretrain-competition
  # SFT checkpoint-372 LoRA (r=64, alpha=64, dropout=0.05 at source, closed at RL runtime)
  sft_adapter: /home/lyc/REC_PROJECTS/KSLLM4REC/artifacts/sft/platform_exports/frontier_LORA_6464_000015_正则0001/checkpoint-372/train-task-tw1g09-1784715567-epoch2
