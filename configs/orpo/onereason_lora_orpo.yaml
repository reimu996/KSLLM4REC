### dataset
dataset: orpo_all_tasks_32705
dataset_dir: /home/lyc/REC_PROJECTS/KSLLM4REC/artifacts/orpo/data/all_tasks_32705
template: qwen3_nothink
cutoff_len: 16384
packing: false
neat_packing: false
train_on_prompt: false
